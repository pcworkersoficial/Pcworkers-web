<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="pcGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0078D4"/>

    </linearGradient>

  </defs>

  <!-- ISOTIPO -->

  <g transform="translate(40,35)">

    <!-- W -->

    <path
